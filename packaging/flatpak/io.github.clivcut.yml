# Flatpak do clivcut.
#
#   flatpak install flathub org.kde.Sdk//6.11 org.kde.Platform//6.11
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/io.github.clivcut.yml
#   flatpak run io.github.clivcut
#
# FFmpeg é compilado aqui com x264 (GPL) e VA-API; o do runtime não tem H.264.
app-id: io.github.clivcut
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: clivcut
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Download dos modelos de IA (legendas, recorte, voz), opcional e sob demanda.
  - --share=network
  # Projetos referenciam mídias por caminho absoluto em qualquer lugar da pasta pessoal.
  - --filesystem=home
  - --filesystem=xdg-run/pipewire-0
  - --env=QT_QPA_PLATFORM=wayland;xcb
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - '*.a'
modules:
  - name: x264
    config-opts:
      - --enable-shared
      - --enable-pic
      - --disable-cli
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        branch: stable

  - name: ffmpeg
    config-opts:
      - --enable-gpl
      - --enable-shared
      - --disable-static
      - --disable-programs
      - --disable-doc
      - --enable-libx264
      - --enable-libdav1d
      - --enable-libopus
      - --enable-libvpx
      - --enable-vaapi
      - --enable-vulkan
    sources:
      - type: git
        url: https://git.ffmpeg.org/ffmpeg.git
        tag: n8.0.3

  - name: whisper-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DWHISPER_BUILD_TESTS=OFF
      - -DWHISPER_BUILD_EXAMPLES=OFF
      - -DWHISPER_BUILD_SERVER=OFF
      - -DGGML_NATIVE=OFF
    sources:
      - type: git
        url: https://github.com/ggml-org/whisper.cpp.git
        tag: v1.9.4

  # Texto → fonemas para a voz neural; os dados ficam em /app/share/espeak-ng-data.
  - name: espeak-ng
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DUSE_MBROLA=OFF
      - -DUSE_LIBSONIC=OFF
      - -DUSE_LIBPCAUDIO=OFF
      - -DUSE_KLATT=OFF
      - -DUSE_SPEECHPLAYER=OFF
      - -DUSE_ASYNC=OFF
      - -DBUILD_TESTING=OFF
      - -DESPEAK_BUILD_MANPAGES=OFF
    cleanup:
      - /bin
      - /include
      - /share/vim
    sources:
      - type: archive
        url: https://github.com/espeak-ng/espeak-ng/archive/refs/tags/1.52.0.tar.gz
        sha256: bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23

  - name: clivcut
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLIVCUT_BUILD_TESTS=OFF
      - -DCLIVCUT_SYSTEM_ESPEAK=ON
      # O build do Flatpak não tem rede: o ONNX Runtime vem como fonte abaixo, não pelo FetchContent.
      - -DCLIVCUT_ONNXRUNTIME_ROOT=/run/build/clivcut/onnxruntime
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-appimage
          - build-flatpak
          - dist
          - .flatpak-builder
          - .claude
          - _bmad
          - _bmad-output
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz
        sha256: a5ed5a3cac51fbb2e90da632ae43d19212faaa20e76484e62bcb7c23ddb3b3fd
        dest: onnxruntime
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-aarch64-1.30.0.tgz
        sha256: e16a27a8ed330bbc698df7330b0cf56e722f354e3bcc92118682c74ef3c3e3da
        dest: onnxruntime
