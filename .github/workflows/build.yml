name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ffmpeg libfuse2 \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev \
            libsdl2-dev libva-dev libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 librsvg2-bin \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools qtwaylandcompositor
          cache: true

      - name: Compilar e testar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build
          # Sem GPU no runner: X virtual + Mesa por software (llvmpipe/lavapipe) para os testes de render/export.
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy xvfb-run -a -s "-screen 0 1920x1080x24" \
            ctest --test-dir build --output-on-failure

      - name: AppImage
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" packaging/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: clivcut-linux-appimage
          path: dist/*.AppImage

      - name: .tar.gz, .deb e .rpm
        run: packaging/linux/build-packages.sh

      - name: Testar os pacotes em distros limpas
        run: DISTROS="ubuntu-24.04 fedora-42" packaging/linux/test-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: clivcut-linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: FFmpeg e SDL2 (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install --triplet x64-windows `
            "ffmpeg[core,avcodec,avformat,avfilter,swscale,swresample,gpl,x264,dav1d,opus]" sdl2

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compilar
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build

      - name: Testes (sem GPU)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"; $env:SDL_AUDIODRIVER = "dummy"
          ctest --test-dir build --output-on-failure -E "render|controller"

      - name: Testes de render (Direct3D 11)
        shell: pwsh
        run: |
          # Direto (não pelo ctest), com o resultado num arquivo: mostra o backend e cada caso.
          $env:QT_QPA_PLATFORM = "offscreen"
          & .\build\tst_render.exe -o render.txt,txt
          $code = $LASTEXITCODE
          Get-Content render.txt
          exit $code

      - name: Instalador
        shell: pwsh
        run: |
          cd build
          cpack -G "NSIS;ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: clivcut-windows
          path: |
            build/clivcut-*-win64.exe
            build/clivcut-*-win64.zip

  macos-tests:
    name: macOS (tests)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Dependências
        run: brew install ninja pkg-config ffmpeg sdl2 qt

      - name: Compilar e testar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build
          QT_QPA_PLATFORM=offscreen SDL_AUDIODRIVER=dummy ctest --test-dir build --output-on-failure -E "render|controller"
          # Compositor no Metal (conversão YUV, orientação das texturas).
          QT_QPA_PLATFORM=offscreen ctest --test-dir build -V -R render

  # Os .dmg saem do builder em Docker (packaging/macos/Dockerfile), o mesmo do
  # `make dmg` local: cross-compile num runner Linux. Só o SDK vem de um runner
  # macOS, e fica no cache do Actions (não é publicado).
  macos-sdk:
    name: macOS SDK
    # DMGs só em tags de versão ou disparo manual: o builder leva ~40 min por arquitetura.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    outputs:
      key: ${{ steps.sdk.outputs.key }}
    steps:
      - uses: actions/checkout@v5

      - id: sdk
        run: echo "key=macos-sdk-$(xcrun --sdk macosx --show-sdk-version)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/macos-sdk
          key: ${{ steps.sdk.outputs.key }}
          lookup-only: true

      - if: steps.cache.outputs.cache-hit != 'true'
        run: sh packaging/macos/export-sdk.sh .cache/macos-sdk

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/macos-sdk
          key: ${{ steps.sdk.outputs.key }}

  macos:
    name: macOS DMG (${{ matrix.arch }})
    needs: macos-sdk
    # DMGs só em tags de versão ou disparo manual: o builder leva ~40 min por arquitetura.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      # A imagem do builder (Qt de macOS e de Linux + FFmpeg das duas arquiteturas) é grande.
      - name: Espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/cache/restore@v4
        with:
          path: .cache/macos-sdk
          key: ${{ needs.macos-sdk.outputs.key }}
          fail-on-cache-miss: true

      - uses: docker/setup-buildx-action@v3

      - name: Builder
        uses: docker/build-push-action@v6
        with:
          context: packaging/macos
          file: packaging/macos/Dockerfile
          build-contexts: sdk=.cache/macos-sdk
          tags: clivcut-macos-builder
          load: true
          cache-from: type=gha,scope=macos-builder
          cache-to: type=gha,mode=max,scope=macos-builder

      - name: DMG
        run: make dmg SKIP_BUILDER=1 ARCHS=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: clivcut-macos-${{ matrix.arch }}
          path: dist/clivcut-*.dmg

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: clivcut.flatpak
          manifest-path: packaging/flatpak/io.github.clivcut.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/io.github.clivcut.yml') }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, macos-tests, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          # Só os pacotes: o build do macOS também deixa registros *.dockerbuild.
          pattern: clivcut-*
          merge-multiple: true

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/clivcut.flatpak "dist/clivcut-${GITHUB_REF_NAME#v}-x86_64.flatpak"
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "clivcut ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
